# Alembic cho Serving Plane (`W4-05`).
#
# `sqlalchemy.url` cố ý **để trống**: DSN có mật khẩu, và một DSN trong file này
# là một mật khẩu trong git. `alembic/env.py` đọc nó từ `rag_core.settings`, tức
# từ cùng một chỗ mà ứng dụng đọc — hai nguồn cấu hình cho cùng một database là
# cách migration chạy trên DB này còn ứng dụng nói chuyện với DB kia.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
