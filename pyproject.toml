[project]
name = "rag-platform"
version = "0.1.0"
description = "Production RAG platform — pipeline plane (offline eval) tách khỏi serving plane (online)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Lõi cố ý giữ nhẹ: rag_core chỉ cần pydantic + numpy.
# Mọi thứ nặng (torch, qdrant, fastapi) nằm ở optional-dependencies để
# unit test chạy được trong vài giây mà không cần cài GPU stack.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# Phải khớp major/minor với image server trong infra/docker-compose.yml.
qdrant = [
    "qdrant-client>=1.15,<1.16",
]
pipeline = [
    "pyyaml>=6.0",
    "tqdm>=4.66",
]
# Parse tài liệu (W3-01). Nặng — kéo theo torchvision + opencv + rapidocr — nên
# **không** nằm trong `pipeline`: `rag_core.loaders` import docling lazy và
# đường `.txt`/`.md` chạy được khi thiếu nó hoàn toàn.
ingestion = [
    "docling>=2.121,<3",
]
# Client cho API tương thích OpenAI (DeepSeek, OpenRouter). Cố ý không dùng SDK
# `openai`: chỉ cần đúng một endpoint, và cần kiểm soát chính xác phần retry +
# đọc `prompt_cache_hit_tokens` mà schema chuẩn không có.
llm = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]
data = [
    "dvc>=3.55",
]
# MLflow chỉ dùng ở **pipeline plane** (theo dõi thí nghiệm offline). Để nó ngoài
# `pipeline` extra vì nó kéo theo cả một web stack (flask, alembic, sqlalchemy,
# gunicorn/waitress) chỉ để phục vụ UI — CI chạy unit test không cần thứ đó, và
# `pipeline/experiments/tracking.py` chạy đúng khi thiếu nó.
tracking = [
    "mlflow>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --------------------------------------------------------------------------
# uv — nguồn wheel cho torch
# --------------------------------------------------------------------------
# Trên Windows, wheel `torch` mặc định trên PyPI là bản **CPU-only**. Cài từ đó
# thì mọi thứ vẫn chạy, chỉ là chậm hơn ~10 lần và `torch.cuda.is_available()`
# trả False mà không báo lỗi gì — đúng kiểu hỏng âm thầm khiến người ta tưởng
# GPU yếu. Ghim index CUDA để `EMBEDDING_DEVICE=auto` thật sự chọn được `cuda`.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["packages/rag_core", "pipeline", "serving"]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # Bản POC gốc. Cố ý không lint/format: nó là mốc so sánh cho `W1-13`, và sửa
    # format trên thứ sắp bị xoá ở `W6-05` chỉ tạo diff nhiễu. Xem legacy/README.md
    "legacy/",
    # Ruff format cũng định dạng lại code block Python bên trong Markdown. Với
    # tài liệu viết tay (README, các bản trình bày) đó là sửa ngoài ý muốn.
    "*.md",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "RUF001",  # ký tự Unicode "mơ hồ" — docstring tiếng Việt có dấu là cố ý
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
# `rag_core` sống trong `packages/` nên ruff không tự nhận ra là first-party.
known-first-party = ["rag_core", "pipeline", "serving"]

# --------------------------------------------------------------------------
# Mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "packages"
files = ["packages", "pipeline", "serving", "tests"]
exclude = ["^legacy/"]
strict = true
warn_unreachable = true
# Thư viện bên thứ ba chưa có type stub — không để chúng làm hỏng strict mode của code mình
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "qdrant_client.*", "torch.*", "pypdfium2.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# ⚠️ `-q` ĐÃ CÓ Ở ĐÂY — đừng thêm `-q` trên dòng lệnh nữa.
# `pytest -q` cộng với dòng này thành `-qq`, và `-qq` **tắt hẳn** dòng tổng kết
# ("974 passed in 267s"). Hệ quả không phải mỹ quan: ở `W2-05` tôi gõ `-q` theo
# phản xạ suốt cả phiên, nên mọi con số test báo ra đều là suy từ
# `--collect-only` cộng exit code chứ chưa lần nào đọc trực tiếp; và một vòng
# `until grep "passed"` canh file output đó đã quay vô ích 1h47m vì chuỗi ấy
# không bao giờ xuất hiện. Các target trong `Makefile` cố ý **không** thêm `-q`.
addopts = "-q --strict-markers"
markers = [
    # "ngoài" = ngoài Python thuần: service (Qdrant/Postgres/Redis) hoặc trọng số
    # model phải tải về (OCR ở `W3-02`). Điểm chung là chúng không chạy được
    # trong một vòng lặp `make test` vài giây.
    "integration: cần service ngoài hoặc trọng số model — chạy bằng `make test-integration`",
    "gpu: cần GPU cục bộ",
    "slow: chạy lâu, loại khỏi vòng lặp phát triển",
]

[tool.coverage.run]
source = ["packages/rag_core"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
